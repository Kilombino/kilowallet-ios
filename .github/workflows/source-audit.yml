name: Release readiness checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify Gradle bootstrap
        run: |
          set -euo pipefail
          echo '76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  gradle/wrapper/gradle-wrapper.jar' | shasum -a 256 -c -
          curl --fail --location --proto '=https' --tlsv1.2 https://services.gradle.org/distributions/gradle-9.1.0-bin.zip.sha256 -o /tmp/kw-gradle.sha256
          CHECKSUM=$(cat /tmp/kw-gradle.sha256)
          test "${#CHECKSUM}" = 64
          printf '\ndistributionSha256Sum=%s\n' "$CHECKSUM" >> gradle/wrapper/gradle-wrapper.properties
      - name: Wallet regression tests on JVM and iOS
        run: ./gradlew --no-daemon :core:jvmTest :core:iosSimulatorArm64Test :app:desktopTest :app:iosSimulatorArm64Test --stacktrace
      - name: Unsigned Release device build
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -version
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/audit-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build > build/audit-xcodebuild.log 2>&1
          test -x build/audit-dd/Build/Products/Release-iphoneos/Kilowallet.app/Kilowallet
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-audit-evidence
          path: |
            core/build/test-results/
            core/build/reports/tests/
            app/build/test-results/
            app/build/reports/tests/
            build/audit-xcodebuild.log

  screens:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Verify wrapper and build simulator app
        run: |
          set -euo pipefail
          echo '76805e32c009c0cf0dd5d206bddc9fb22ea42e84db904b764f3047de095493f3  gradle/wrapper/gradle-wrapper.jar' | shasum -a 256 -c -
          mkdir -p build
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/dd ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build > build/simulator.log 2>&1
          test -x build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app/Kilowallet
      - name: Launch all principal screens with disposable demo data
        run: ./scripts/ci-screenshots.sh build/dd/Build/Products/Debug-iphonesimulator/Kilowallet.app screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: simulator-screen-evidence
          path: |
            screenshots/
            screenshots-logs/
            build/simulator.log
