name: Tor engine (iOS)

# Builds KilombinoTor.xcframework (device arm64 + simulator arm64/x86_64) from tor-engine/ENGINE.
# The binary is not kept in git: the app's workflow downloads this run's artifact and checks its
# sha256 against ENGINE. It runs when tor-engine/build-ios.sh or the crate changes (or by hand once
# this file is on main); then write run= and sha256= in ENGINE (that edit alone does not rebuild).

on:
  workflow_dispatch:
  push:
    paths: [tor-engine/build-ios.sh, tor-engine/kilombino-tor/**]

jobs:
  build:
    name: Arti as a static library (iOS)
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./tor-engine/build-ios.sh
      - uses: actions/upload-artifact@v4
        with:
          name: KilombinoTor-xcframework
          path: |
            build/tor/KilombinoTor.xcframework.zip
            build/tor/KilombinoTor.xcframework.zip.sha256
            build/tor/exported.txt
          retention-days: 90
          compression-level: 0
